[package]
name = "handl-plugin-compile-term"
version.workspace = true
edition.workspace = true
description = "Term JSON compiler for canonical Handl sources (ADR-0114)."
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["handl", "term", "compiler", "arrow-calculus"]
categories = ["compilers"]

[dependencies]
handl-plugin-compile = { git = "https://github.com/handl-lang/host", branch = "main" }
serde_json = "1"
handl-calculus = { git = "https://github.com/handl-lang/kernel", branch = "main" }
hnl-engine-codegen = { git = "https://github.com/handl-lang/engine-codegen", branch = "main", features = ["handl-term"] }